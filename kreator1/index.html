<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreator Instrukcji Krok po Kroku</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>

<header id="topbar">
  <div id="topbar-left">
    <div id="logo-mark">📋</div>
    <div>
      <div id="app-title">Kreator Instrukcji</div>
      <div id="app-sub">instrukcja krok po kroku</div>
    </div>
  </div>
  <div id="topbar-actions">
    <button id="btnClear" class="btn-secondary">🗑 Wyczyść</button>
    <button id="btnPDF" class="btn-primary">⬇ Eksportuj PDF</button>
    <button id="btnDOCX" class="btn-primary">📄 Eksportuj DOCX</button>
  </div>
</header>

<div id="layout">

  <!-- LEWA KOLUMNA: EDYTOR -->
  <div id="editor">

    <section class="card">
      <h2 class="section-title">📋 Podstawowe informacje</h2>
      <div class="field">
        <label for="docTitle">Tytuł instrukcji</label>
        <input type="text" id="docTitle" placeholder="np. Adresowanie urządzeń DALI">
      </div>
      <div class="field">
        <label for="docDesc">Krótki opis <span class="optional">(opcjonalnie)</span></label>
        <textarea id="docDesc" rows="2" placeholder="Krótki opis czego dotyczy instrukcja..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="templateSelect">Szablon wyglądu</label>
          <select id="templateSelect">
            <option value="default">Domyślny (niebieski)</option>
            <option value="tech">Techniczny (szary)</option>
            <option value="dali">DALI (fioletowy)</option>
            <option value="minimal">Minimalistyczny (zielony)</option>
          </select>
        </div>
        <div class="field">
          <label for="photoPrefix">Oznaczenie zdjęć</label>
          <select id="photoPrefix">
            <option value="Fot.">Fot. (fotografia)</option>
            <option value="Rys.">Rys. (rysunek)</option>
            <option value="Fig.">Fig. (figure)</option>
            <option value="">Brak oznaczenia</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2 class="section-title">🔢 Kroki instrukcji</h2>
        <button id="addStep" class="btn-add">+ Dodaj krok</button>
      </div>
      <p class="hint">💡 Przeciągnij kroki aby zmienić kolejność. Każdy krok może mieć tekst, opis i zdjęcia.</p>
      <div id="stepsContainer"></div>
      <div id="addStepBottom" style="display:none">
        <button id="btnAddStepBottom" class="btn-add btn-add-bottom">+ Dodaj krok</button>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">✅ Zakończenie instrukcji <span class="optional">(opcjonalnie)</span></h2>
      <div class="field">
        <textarea id="docEnding" rows="3" placeholder="np. Instrukcja zakończona. W razie pytań skontaktuj się z działem technicznym."></textarea>
      </div>
    </section>

  </div>

  <!-- PRAWA KOLUMNA: PODGLĄD -->
  <div id="preview-col">
    <div id="preview-sticky">
      <div id="preview-label">Podgląd instrukcji</div>
      <div id="previewDoc">
        <div id="previewContent"></div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>

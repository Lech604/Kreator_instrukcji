<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kreator instrukcji</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- LEWA KOLUMNA – EDYTOR -->
  <div id="editor">
    <h2>Edytor instrukcji</h2>

    <label>Tytuł instrukcji:</label>
    <input type="text" id="title" placeholder="Np. Adresowanie urządzeń DALI">

    <label>Opis instrukcji:</label>
    <textarea id="description" placeholder="Krótki opis instrukcji..."></textarea>

    <h3>Kroki</h3>
    <div id="stepsContainer"></div>
    <button id="addStep">➕ Dodaj krok</button>

    <h3>Szablon</h3>
    <select id="templateSelect">
      <option value="default">Domyślny</option>
      <option value="tech">Techniczny</option>
      <option value="dali">DALI</option>
      <option value="ikea">IKEA‑style</option>
    </select>
  </div>

  <!-- PRAWA KOLUMNA – PODGLĄD -->
  <div id="preview">
    <h2>Podgląd instrukcji</h2>
    <div id="output"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Nowy kreator instrukcji</title>

  <style>
    /* Układ 2 kolumn */
    #app {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    /* Lewa kolumna – edytor */
    #editor {
      width: 40%;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    /* Prawa kolumna – podgląd */
    #preview {
      width: 60%;
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #output {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    /* BLOKI ZDJĘĆ W EDYTORZE */
    .imageBlock {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #ccc;
    }

    .imageBlock img {
      max-width: 100%;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .imageBlock input {
      width: 100%;
      margin-bottom: 8px;
    }

    .imageBlock button {
      margin-right: 5px;
    }

    /* PODGLĄD ZDJĘĆ W DOKUMENCIE */
    .imagePreview img {
      max-width: 100%;
      margin: 10px 0;
    }

    .imagePreview p {
      font-size: 14px;
      color: #555;
      margin-top: -5px;
    }

    /* Kroki */
    .stepItem {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .stepInput {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #bbb;
    }

    .stepItem button {
      background: #ddd;
      color: #333;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      border: none;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- LEWA KOLUMNA – EDYTOR -->
  <div id="editor">
    <h2>Edytor instrukcji</h2>

    <label>Tytuł instrukcji:</label>
    <input type="text" id="title" placeholder="Np. Adresowanie urządzeń DALI">

    <label>Opis instrukcji:</label>
    <textarea id="description" placeholder="Krótki opis instrukcji..."></textarea>

    <h3>Kroki</h3>
    <div id="stepsContainer"></div>
    <button id="addStep">➕ Dodaj krok</button>

    <h3>Zdjęcia</h3>
    <div id="imagesContainer"></div>
    <button id="addImage">➕ Dodaj zdjęcie</button>

    <h3>Szablon</h3>
    <select id="templateSelect">
      <option value="default">Domyślny</option>
      <option value="tech">Techniczny</option>
      <option value="dali">DALI</option>
      <option value="ikea">IKEA‑style</option>
    </select>
  </div>

  <!-- PRAWA KOLUMNA – PODGLĄD -->
  <div id="preview">
    <h2>Podgląd instrukcji</h2>
    <div id="output"></div>
  </div>

</div>

<script>
// =========================
// REFERENCJE DO ELEMENTÓW
// =========================
const stepsContainer = document.getElementById("stepsContainer");
const imagesContainer = document.getElementById("imagesContainer");
const output = document.getElementById("output");

// =========================
// OBSŁUGA PRZYCISKÓW
// =========================
document.getElementById("addStep").addEventListener("click", () => {
    addStep("");
    updatePreview();
});

document.getElementById("addImage").addEventListener("click", () => {
    addImageBlock();
    updatePreview();
});

document.getElementById("title").addEventListener("input", updatePreview);
document.getElementById("description").addEventListener("input", updatePreview);
document.getElementById("templateSelect").addEventListener("change", updatePreview);

// =========================
// FUNKCJA: DODAWANIE KROKU
// =========================
function addStep(text) {
    const stepDiv = document.createElement("div");
    stepDiv.className = "stepItem";

    stepDiv.innerHTML = `
        <input type="text" class="stepInput" value="${text}" placeholder="Wpisz krok...">
        <button class="moveUp">↑</button>
        <button class="moveDown">↓</button>
        <button class="deleteStep">🗑</button>
    `;

    stepsContainer.appendChild(stepDiv);

    stepDiv.querySelector(".deleteStep").addEventListener("click", () => {
        stepDiv.remove();
        updatePreview();
    });

    stepDiv.querySelector(".moveUp").addEventListener("click", () => {
        if (stepDiv.previousElementSibling) {
            stepsContainer.insertBefore(stepDiv, stepDiv.previousElementSibling);
            updatePreview();
        }
    });

    stepDiv.querySelector(".moveDown").addEventListener("click", () => {
        if (stepDiv.nextElementSibling) {
            stepsContainer.insertBefore(stepDiv.nextElementSibling, stepDiv);
            updatePreview();
        }
    });

    stepDiv.querySelector(".stepInput").addEventListener("input", updatePreview);
}

// =========================
// FUNKCJA: DODAWANIE ZDJĘCIA
// =========================

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kreator instrukcji</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Kreator instrukcji_v2</h1>

  <div class="form">
    <label>Tytuł instrukcji:</label>
    <input type="text" id="title" placeholder="Np. Jak wymienić żarówkę">
    <label>Ikona instrukcji:</label>
<select id="iconSelect">
  <option value="">Brak</option>
  <option value="💡">DALI / Oświetlenie</option>
  <option value="⚡">Elektryka</option>
  <option value="🟦 LMS">LMS</option>
  <option value="🔷 DALI">DALI</option>
</select>
    <label>Szablon instrukcji:</label>
<select id="templateSelect">
  <option value="default">Domyślny</option>
  <option value="tech">Techniczny</option>
  <option value="dali">DALI</option>
  <option value="ikea">IKEA‑style</option>
</select>



    <label>Kroki instrukcji:</label>
    <textarea id="steps" placeholder="Wpisz każdy krok w nowej linii"></textarea>

    <button id="generate">Generuj instrukcję</button>
  </div>

  <h2>Wynik instrukcji <span id="icon"></span>:</h2>

  <div id="output"></div>

  <script src="app.js"></script>
</body>
</html>

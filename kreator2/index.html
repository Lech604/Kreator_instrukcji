<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kreator instrukcji – Uniwersalny</title>
  <link rel="stylesheet" href="style.css">

  <!-- PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>

<body>

<div id="app">

  <!-- LEWA KOLUMNA – EDYTOR -->
  <div id="editor">
    <h2>Edytor instrukcji_v17</h2>

    <label for="title">Tytuł instrukcji:</label>
    <input type="text" id="title" placeholder="Np. Adresowanie urządzeń DALI">

    <label for="description">Opis instrukcji:</label>
    <textarea id="description" placeholder="Krótki opis instrukcji..."></textarea>

    <h3>Kroki</h3>
    <p class="hint">💡 Przeciągaj kroki, aby zmieniać ich kolejność.</p>
    <div id="stepsContainer"></div>
    <button id="addStep">➕ Dodaj krok</button>

    <h3>Zakończenie instrukcji</h3>
    <textarea id="ending" placeholder="Np. Instrukcja zakończona. W razie pytań skontaktuj się z działem technicznym."></textarea>

    <h3>Oznaczenie zdjęć</h3>
    <select id="photoPrefix">
      <option value="Fot.">Fot. (fotografia)</option>
      <option value="Rys.">Rys. (rysunek)</option>
      <option value="Fig.">Fig. (figure)</option>
      <option value="">Brak oznaczenia</option>
    </select>

    <h3>Szablon</h3>
    <select id="templateSelect">
      <option value="default">Domyślny (niebieski)</option>
      <option value="tech">Techniczny (monochromatyczny)</option>
      <option value="dali">DALI (pomarańczowy)</option>
      <option value="ikea">IKEA-style (niebieski + żółty)</option>
    </select>

    <div class="buttonGroup">
      <button id="exportPDF">📄 Eksportuj do PDF</button>
      <button id="exportDOCX">📄 Eksportuj do DOCX (Word)</button>
    </div>

    <button id="clearState" class="btnDanger">🗑 Wyczyść instrukcję</button>
  </div>

  <!-- PRAWA KOLUMNA – PODGLĄD -->
  <div id="preview">
    <h2>Podgląd instrukcji</h2>
    <div id="output"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
